name: sewa_garasi
description: Aplikasi penyewaan garasi kendaraan (Uji Kompetensi Pemrogram).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  # State management (pola MVVM: View <- ViewModel)
  provider: ^6.1.2
  # Basis data relasional SQLite
  sqflite: ^2.3.3
  path: ^1.9.0
  # Lokasi folder dokumen aplikasi untuk menyimpan gambar
  path_provider: ^2.1.4
  # Memilih gambar KTP / bukti bayar dari galeri atau kamera
  image_picker: ^1.1.2
  # Hash password (SHA-256)
  crypto: ^3.0.5
  # Format tanggal dan mata uang Rupiah
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # SQLite versi desktop agar repository bisa diuji dengan `flutter test`
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
